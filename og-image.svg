<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="631" cy="-65" r="35" fill="#991b1b" opacity="0.19"/>
    <circle cx="628" cy="142" r="28" fill="#991b1b" opacity="0.08"/>
    <circle cx="-32" cy="203" r="88" fill="#991b1b" opacity="0.19"/>
    <circle cx="28" cy="3" r="33" fill="#991b1b" opacity="0.06"/>
    <circle cx="1273" cy="702" r="78" fill="#991b1b" opacity="0.06"/>
    <circle cx="-1" cy="517" r="53" fill="#991b1b" opacity="0.10"/>
    <rect x="784" y="568" width="34" height="58" rx="8" fill="#b91c1c" opacity="0.07" transform="rotate(30, 238, 16)"/>
    <rect x="445" y="436" width="88" height="92" rx="8" fill="#b91c1c" opacity="0.03" transform="rotate(4, 940, 28)"/>
    <rect x="287" y="-41" width="25" height="57" rx="8" fill="#b91c1c" opacity="0.08" transform="rotate(7, 1131, 697)"/>
    <rect x="830" y="146" width="51" height="38" rx="8" fill="#b91c1c" opacity="0.04" transform="rotate(1, 1278, 47)"/>
    <rect x="1208" y="192" width="37" height="39" rx="8" fill="#b91c1c" opacity="0.11" transform="rotate(0, 1162, -9)"/>
    <rect x="958" y="186" width="38" height="21" rx="8" fill="#b91c1c" opacity="0.13" transform="rotate(37, 544, 373)"/>
    <rect x="1095" y="485" width="80" height="49" rx="8" fill="#b91c1c" opacity="0.14" transform="rotate(34, 322, -79)"/>
    <rect x="124" y="45" width="99" height="69" rx="8" fill="#b91c1c" opacity="0.03" transform="rotate(13, 412, 359)"/>
    <polygon points="692,466 788,658 596,658" fill="#991b1b" opacity="0.08"/>
    <polygon points="-7,197 36,283 -50,283" fill="#991b1b" opacity="0.04"/>
    <polygon points="574,438 603,496 545,496" fill="#991b1b" opacity="0.04"/>
    <polygon points="1144,390 1241,584 1047,584" fill="#991b1b" opacity="0.04"/>

  <!-- Wave at bottom -->
  <path d="M0,574 C360,602 840,546 1200,574 L1200,630 L0,630Z" fill="#991b1b" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    홍대 코인노래방 추천
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    홍대 — 코인노래방
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#fca5a5" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    홍대 홍대 코인노래방 추천 — 코인노래방
  </text>
</svg>